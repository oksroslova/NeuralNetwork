site_name: Нейронные сети в машинном обучении
site_description: Справочник лекций, АНО ВО «Университет «Технополис»
site_url: https://oksroslova.github.io/NeuralNetwork/
repo_url: https://github.com/oksroslova/NeuralNetwork
repo_name: oksroslova/NeuralNetwork

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.indexes

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

extra_css:
  - stylesheets/extra.css

nav:
  - Главная: index.md
  - Вводная лекция: lectures/00_intro/index.md
  - "Раздел 1. Введение в нейронные сети":
      - lectures/1_lecture/index.md
      - "Лекция 1.1. Основные понятия: нейроны, слои, функции активации": lectures/1_lecture/1_1_lecture/index.md
      - Лабораторная работа 1.1: lectures/1_lecture/1_1_lecture/lab_1_1.md
      - "Лекция 1.2. Обучение нейросетей: градиентный спуск, backpropagation": lectures/1_lecture/1_2_lecture/index.md
      - Лабораторная работа 1.2: lectures/1_lecture/1_2_lecture/lab_1_2.md
  - "Раздел 2. Основы глубокого обучения":
      - lectures/2_lecture/index.md
      - "Лекция 2.1. Полносвязные сети (MLP), регуляризация (Dropout, BatchNorm)": lectures/2_lecture/2_1_lecture/index.md
      - Лабораторная работа 2.1: lectures/2_lecture/2_1_lecture/lab_2_1.md
      - "Лекция 2.2. Оптимизаторы (Adam, RMSprop), переобучение": lectures/2_lecture/2_2_lecture/index.md
      - Лабораторная работа 2.2: lectures/2_lecture/2_2_lecture/lab_2_2.md
  - "Раздел 3. Сверточные нейронные сети CNN)":
      - lectures/3_lecture/index.md
      - "Лекция 3.1. Архитектуры CNN (LeNet, ResNet), transfer learning": lectures/3_lecture/3_1_lecture/index.md
      - Лабораторная работа 3.1: lectures/3_lecture/3_1_lecture/lab_3_1.md
      - "Лекция 3.2. Применение в компьютерном зрении (классификация, детекция)": lectures/3_lecture/3_2_lecture/index.md
      - Лабораторная работа 3.2: lectures/3_lecture/3_2_lecture/lab_3_2.md
  - "Раздел 4. Рекурентные нейронные сети (RNN/LSTM)":
      - lectures/4_lecture/index.md
      - "Лекция 4.1. Обработка временных рядов, архитектуры RNN": lectures/4_lecture/4_1_lecture/index.md
      - Лабораторная работа 4.1: lectures/4_lecture/4_1_lecture/lab_4_1.md
      - "Лекция 4.2. Практикум: прогнозирование и NLP (базовые задачи)": lectures/4_lecture/4_2_lecture/index.md
      - Лабораторная работа 4.2: lectures/4_lecture/4_2_lecture/lab_4_2.md
  - "Раздел 5. Генеративные модели (GAN/VAE)":
      - lectures/5_lecture/index.md
      - "Лекция 5.1. Принципы GAN: генератор и дискриминатор": lectures/5_lecture/5_1_lecture/index.md
      - Лабораторная работа 5.1: lectures/5_lecture/5_1_lecture/lab_5_1.md
      - "Лекция 5.2. VAE и диффузионные модели": lectures/5_lecture/5_2_lecture/index.md
      - Лабораторная работа 5.2: lectures/5_lecture/5_2_lecture/lab_5_2.md
  - "Раздел 6. Трансформеры и NLP":
      - lectures/6_lecture/index.md
      - "Лекция 6.1. Архитектура трансформеров, attention-механизмы": lectures/6_lecture/6_1_lecture/index.md
      - Лабораторная работа 6.1: lectures/6_lecture/6_1_lecture/lab_6_1.md
      - "Лекция 6.2. Fine-tuning (дообучение) BERT/GPT": lectures/6_lecture/6_2_lecture/index.md
      - Лабораторная работа 6.2: lectures/6_lecture/6_2_lecture/lab_6_2.md
  - "Раздел 7. Оптимизация и интерпретация моделей":
      - lectures/7_lecture/index.md
      - "Лекция 7.1. Метрики качества, интерпретация (SHAP, LIME)": lectures/7_lecture/7_1_lecture/index.md
      - Лабораторная работа 7.1: lectures/7_lecture/7_1_lecture/lab_7_1.md
      - "Лекция 7.2. Деплой моделей (ONNX, Flask/Docker)": lectures/7_lecture/7_2_lecture/index.md
      - Лабораторная работа 7.2: lectures/7_lecture/7_2_lecture/lab_7_2.md
  - "Экзамен":
      - lectures/exam/index.md

